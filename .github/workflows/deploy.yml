name: Deploy AI Governance Control Plane

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'infrastructure/**'
      - 'policies/**'
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate OPA policies
        run: |
          for policy in policies/opa/*.rego; do
            echo "Validating $policy"
            # Using rego check (requires opa installed)
            # opa check $policy || exit 1
          done

      - name: Validate Cedar policies
        run: |
          for policy in policies/cedar/*.cedar; do
            echo "Validating $policy"
            # Using cedar validate (requires cedar installed)
            # cedar validate $policy || exit 1
          done

      - name: Validate JSON files
        run: |
          for file in audit-framework/*.json; do
            echo "Validating $file"
            jq empty "$file" || exit 1
          done

      - name: Validate YAML files
        run: |
          for file in config-rules/*.yaml; do
            echo "Validating $file"
            python -c "import yaml; yaml.safe_load(open('$file'))" || exit 1
          done

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build SAM application
        run: sam build

      - name: Deploy SAM application
        run: |
          sam deploy \
            --stack-name ai-governance-control-plane \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides file://infrastructure/parameter-overrides.json

      - name: Deploy OPA policies to S3
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name ai-governance-control-plane \
            --query "Stacks[0].Outputs[?OutputKey=='PolicyBucketName'].OutputValue" \
            --output text)
          aws s3 sync policies/opa/ s3://${BUCKET_NAME}/policies/opa/

      - name: Deploy Config conformance pack
        run: |
          aws config put-conformance-pack \
            --conformance-pack-name ai-security-best-practices \
            --template-body file://config-rules/ai-security-best-practices.yaml
